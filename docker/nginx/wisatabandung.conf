# Blok nginx untuk wisatabandung.duckdns.org.
#
# Isi file ini DITEMPELKAN ke /home/azureuser/gondangfarm/nginx.conf di VM,
# karena nginx di sana mem-bind satu file saja ke /etc/nginx/conf.d/default.conf.
#
# Kenapa aman berdampingan dengan blok gondangfarm yang memakai `server_name ... _;`
# (catch-all): nginx selalu mendahulukan server_name yang cocok PERSIS sebelum
# jatuh ke catch-all. Jadi permintaan ke wisatabandung.duckdns.org masuk ke sini,
# selain itu tetap ke gondangfarm.
#
# Catatan: selama blok 443 di bawah belum aktif, membuka https://wisatabandung...
# akan tertangkap catch-all gondangfarm dan menampilkan situs yang salah.

# ─── HTTP :80 ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name wisatabandung.duckdns.org;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $wisata_upstream wisata-app:80;

    # WAJIB tetap lewat HTTP (tidak boleh ikut di-redirect ke HTTPS).
    # Let's Encrypt mengambil file pembuktian di sini setiap kali memperpanjang
    # sertifikat; kalau di-redirect, perpanjangan otomatis akan gagal.
    location /.well-known/acme-challenge/ {
        proxy_pass http://$wisata_upstream;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS :443 ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name wisatabandung.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/wisatabandung.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wisatabandung.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Nama container di-resolve saat runtime, bukan sekali saat nginx start.
    # Tanpa ini, `docker compose up --build` memberi wisata-app IP baru sementara
    # nginx masih memegang IP lama → 502 sampai nginx di-restart.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $wisata_upstream wisata-app:80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://$wisata_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
